<!DOCTYPE html>
<html lang="en">
<head>
    <title>Subject Input Form</title>
</head>
<body>
    <h2>Enter Your Marks</h2>
    <form action="{{ url_for('form') }}" method="post">
        <label for="maths">Maths:</label>
        <input type="number" id="maths" name="maths" required><br><br>

        <label for="science">Science:</label>
        <input type="number" id="science" name="science" required><br><br>

        <label for="history">History:</label>
        <input type="number" id="history" name="history" required><br><br>

        <input type="submit" value="Submit">
    </form>
    <br>
    <p>This average marks is {{score}}</p>
</body>
</html>
